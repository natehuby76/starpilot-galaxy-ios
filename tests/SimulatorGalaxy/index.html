<!doctype html><html data-theme="light"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="./vendor/bootstrap-icons/bootstrap-icons.min.css"><link rel="stylesheet" href="./css/galaxy.css"><link rel="stylesheet" href="./css/settings.css">
<div id="galaxy-bg"></div><div id="galaxy-app"><div class="gx-app"><header class="gx-appbar"><button class="gx-appbar__back" aria-label="Back">Back</button><button class="gx-appbar__home">Home</button><button class="gx-search-toggle" aria-label="Search">Search</button><button class="gx-theme-toggle" aria-label="Switch to dark mode">Theme</button><button class="gx-appbar__menu">Menu</button></header><main class="gx-content"><div class="gx-route-stage"><div class="gx-route"><settings-page mode="local" :unauthorized="noop"></settings-page></div></div></main><bottom-nav path="/settings"></bottom-nav></div></div>
<script type="module">
import {createApp} from './vendor/vue/vue.esm-browser.js';
import {SettingsPage} from './js/settings.js';
import {BottomNav} from './js/bottom-nav.js';
const originalFetch=window.fetch.bind(window);
window.fetch=(url,opts)=>String(url).endsWith('/settings/pages/hub') ? Promise.resolve(Response.json({page:'hub',vehicleIdentified:true,rows:[['aol','Always On Lateral'],['lane_change','Lane Change'],['torque','Steering and Torque'],['lane','Lane Centering']].map(([page,label])=>({page,label,key:page,available:true,value:'',choices:[]}))})) : originalFetch(url,opts);
createApp({components:{SettingsPage,BottomNav},methods:{noop(){}}}).mount('#galaxy-app');
</script></html>
